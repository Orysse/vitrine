    - { key: { fr: prototypes, en: prototypes }, value: Kind }

- id: homelab
  number: 4
  kind: perso
  org: Homelab
  status: { fr: "Projet perso", en: "Personal project" }
  start: null
  end: null
  tag:
    fr: "NixOS · k3s · Cilium · Flux"
    en: "NixOS · k3s · Cilium · Flux"
  line:
    fr: "Un cluster Kubernetes décrit par un fichier de topologie, sans disque et fermé par défaut."
    en: "A Kubernetes cluster described by one topology file, diskless and closed by default."
  impact:
    fr: "3 nœuds, aucun disque."
    en: "3 nodes, no disk."
  figure: "3"
  body:
    - fr: "Un seul fichier de topologie décrit le réseau, l'hôte et les nœuds : ajouter un nœud, c'est ajouter une entrée, et microvm.nix génère la machine. Les nœuds k3s sont des microVMs sans état, leur racine est un tmpfs qui repart vierge à chaque démarrage."
      en: "A single topology file describes the network, the host and the nodes: adding a node means adding an entry, and microvm.nix generates the machine. The k3s nodes are stateless microVMs, their root is a tmpfs that starts fresh at every boot."
    - fr: "Cilium refuse tout par défaut et chaque flux est écrit dans Git. Les secrets sont dans OpenBao, l'accès passe par des passkeys, et CrowdSec filtre l'entrée publique."
      en: "Cilium denies everything by default and every flow is written in Git. Secrets live in OpenBao, access goes through passkeys, and CrowdSec filters the public entry point."
    - fr: "Je sais que ce n'est pas de la production, mais je le construis comme si ça en était."
      en: "I know it is not production, but I build it as if it were."
  materials:
    - { key: { fr: hôte, en: host }, value: "NixOS, deploy-rs" }
    - { key: { fr: nœuds, en: nodes }, value: "k3s en microVMs (microvm.nix)" }
    - { key: { fr: réseau, en: network }, value: "Cilium, WireGuard, refus par défaut" }
    - { key: { fr: gitops, en: gitops }, value: Flux }
    - { key: { fr: identité, en: identity }, value: "Pocket-ID (passkeys), OpenBao, External Secrets" }
    - { key: { fr: sécurité, en: security }, value: CrowdSec }
  links:
    - { label: homelab-nix, url: "https://github.com/Orysse/homelab-nix" }
    - { label: homelab-cluster, url: "https://github.com/Orysse/homelab-cluster" }
    - { label: config, url: "https://github.com/Orysse/config" }

