    - { key: { fr: prototypes, en: prototypes }, value: Kind }

- id: homelab
  number: 4
  kind: perso
  org: Homelab
  status: { fr: "Projet perso", en: "Personal project" }
  start: null
  end: null
  tag:
    fr: "NixOS · Kubernetes · Cilium · Flux"
    en: "NixOS · Kubernetes · Cilium · Flux"
  line:
    fr: "Une bibliothèque Nix pour définir ce qu'est un cluster, et sa topologie écrite en code."
    en: "A Nix library to define what a cluster is, with its topology written as code."
  impact:
    fr: "La topologie d'un cluster, écrite en code."
    en: "A cluster's topology, written as code."
  body:
    - fr: "Une bibliothèque Nix définit ce qu'est un cluster. Un seul fichier de topologie décrit le réseau, l'hôte et les nœuds : ajouter un nœud, c'est ajouter une entrée. Les nœuds Kubernetes ont une racine en tmpfs et repartent vierges à chaque démarrage, l'état vit ailleurs."
      en: "A Nix library defines what a cluster is. A single topology file describes the network, the host and the nodes: adding a node means adding an entry. The Kubernetes nodes have a tmpfs root and start fresh at every boot, the state lives elsewhere."
    - fr: "Cilium refuse tout par défaut et chaque flux est écrit dans Git. Les secrets sont dans OpenBao, l'accès passe par des passkeys, et CrowdSec filtre l'entrée publique."
      en: "Cilium denies everything by default and every flow is written in Git. Secrets live in OpenBao, access goes through passkeys, and CrowdSec filters the public entry point."
    - fr: "Je sais que ce n'est pas de la production, mais je le construis comme si ça en était."
      en: "I know it is not production, but I build it as if it were."
  materials:
    - { key: { fr: topologie, en: topology }, value: { fr: "Nix, un fichier de topologie", en: "Nix, a single topology file" } }
    - { key: { fr: nœuds, en: nodes }, value: { fr: "Kubernetes (k3s), racine en tmpfs", en: "Kubernetes (k3s), tmpfs root" } }
    - { key: { fr: déploiement, en: deploy }, value: deploy-rs }
    - { key: { fr: réseau, en: network }, value: { fr: "Cilium, WireGuard, refus par défaut", en: "Cilium, WireGuard, default deny" } }
    - { key: { fr: gitops, en: gitops }, value: Flux }
    - { key: { fr: identité, en: identity }, value: "Pocket-ID (passkeys), OpenBao, External Secrets" }
    - { key: { fr: sécurité, en: security }, value: CrowdSec }
  links:
    - { label: homelab-nix, url: "https://github.com/Orysse/homelab-nix" }
    - { label: homelab-cluster, url: "https://github.com/Orysse/homelab-cluster" }
    - { label: config, url: "https://github.com/Orysse/config" }

- id: atelier
  number: 5
  kind: asso
  org: "L'Atelier, EPITA"
  status: { fr: Association, en: Student association }
  start: "2024"
  end: null
  tag:
    fr: "Vice-trésorier · tech lead"
    en: "Vice-treasurer · tech lead"
  line:
    fr: "Je maintiens l'infrastructure de l'association sur de vrais serveurs : Proxmox et Kubernetes."
    en: "I maintain the association's infrastructure on real servers: Proxmox and Kubernetes."
  impact:
    fr: "Une infra d'association, sur du vrai matériel."
    en: "An association's infrastructure, on real hardware."
  body:
    - fr: "Je suis vice-trésorier et tech lead de l'association. J'y maintiens l'infrastructure sur des serveurs physiques : les VMs tournent sous Proxmox, les services sont déployés sur Kubernetes. J'y ai aussi installé OpenStack, d'abord à distance depuis l'Indonésie en 2024. Il fonctionnait, mais les besoins de l'association n'en demandaient pas tant : j'y ai renoncé."
      en: "I am vice-treasurer and tech lead of the association. I maintain its infrastructure on physical servers: the VMs run on Proxmox, the services are deployed on Kubernetes. I also set up OpenStack there, first remotely from Indonesia in 2024. It worked, but the association's needs did not call for that much, so I dropped it."
  materials:
    - { key: { fr: serveurs, en: servers }, value: "bare metal" }
    - { key: { fr: vms, en: vms }, value: Proxmox }
    - { key: { fr: services, en: services }, value: Kubernetes }
  logo:
    src: /logos/atelier.svg
    alt: { fr: "Logo de L'Atelier", en: "L'Atelier logo" }
    width: 613
    height: 287
  images:
    - src: /img/placeholder-serveurs.svg
      alt:
        fr: "Photo à venir : les serveurs de l'association."
        en: "Photo to come: the association's servers."
      placeholder: true
