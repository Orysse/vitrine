# The five fiches. Facts come from the spec §4.2 and the CV; nothing is invented.
# Images marked `placeholder: true` wait for photos from Abel.

- id: forge
  number: 1
  kind: pro
  org: "La Forge, EPITA"
  status: { fr: "CDD à temps partiel", en: "Part-time contract" }
  start: "2026-02"
  end: null
  tag:
    fr: "Forge EPITA · 6 sites · 1000+ postes"
    en: "Forge EPITA · 6 sites · 1000+ machines"
  line:
    fr: "Les images NixOS qui démarrent en réseau sur tout le parc de l'école."
    en: "The NixOS images that boot over the network on the school's whole machine fleet."
  impact:
    fr: "Plus de 1000 postes, démarrés par le réseau."
    en: "Over 1000 machines, booted over the network."
  figure: "1000"
  body:
    - fr: "La Forge est l'IT de la pédagogie de l'EPITA. J'y construis avec Nix les images du parc des salles machines, plus de 1000 PC répartis sur 6 sites, et je les distribue en iPXE."
      en: "La Forge is the IT team behind EPITA's teaching. I build the images for the machine rooms with Nix, over 1000 PCs across 6 sites, and ship them over iPXE."
    - fr: "L'infrastructure héberge l'intranet et le Moodle : cloud OpenStack de l'école, datacenter en colocation à Ivry, microservices Java déployés sur Kubernetes par Argo CD. La Forge gère aussi l'annuaire des étudiants pour ces services, avec les données de scolarité : parcours, classe, promo, droits dans l'école, accès aux salles."
      en: "The infrastructure hosts the intranet and Moodle: the school's OpenStack cloud, a colocated datacenter in Ivry, Java microservices deployed on Kubernetes by Argo CD. La Forge also runs the student directory for these services, with the schooling data: curriculum, class, cohort, rights within the school, room access."
    - fr: "Je développe sur l'intranet (piscines, projets) et j'assure le support auprès des équipes pédagogiques et des élèves."
      en: "I develop on the intranet (piscines, projects) and support the teaching staff and the students."
  materials:
    - { key: { fr: build, en: build }, value: Nix }
    - { key: { fr: boot, en: boot }, value: iPXE }
    - { key: { fr: cloud, en: cloud }, value: OpenStack }
    - { key: { fr: déploiement, en: deploy }, value: "Kubernetes, Argo CD" }
    - { key: { fr: services, en: services }, value: { fr: "Java, intranet, Moodle, annuaire", en: "Java, intranet, Moodle, directory" } }
  images:
    - src: /img/dc-ivry.jpg
      alt:
        fr: "Une allée de baies dans le datacenter en colocation à Ivry."
        en: "An aisle of racks in the colocated datacenter in Ivry."
      placeholder: false
      width: 480
      height: 640
    - src: /img/placeholder-salle.svg
      alt:
        fr: "Photo à venir : une salle machines de l'école."
        en: "Photo to come: one of the school's machine rooms."
      placeholder: true

- id: cea
  number: 2
  kind: pro
  org: CEA Saclay
  status: { fr: Stage, en: Internship }
  start: "2025-09"
  end: "2026-01"
  tag:
    fr: "CEA Saclay · TRUST · simulation thermohydraulique"
    en: "CEA Saclay · TRUST · thermohydraulics simulation"
  line:
    fr: "La CI de TRUST, un script lancé chaque nuit sur des PC de chercheurs, refaite sur GitLab CI."
    en: "TRUST's CI, a script run every night on researchers' PCs, rebuilt on GitLab CI."
  impact:
    fr: "D'un script de nuit à une CI standard."
    en: "From a nightly script to a standard CI."
  body:
    - fr: "TRUST est la plateforme de simulation thermohydraulique du CEA. Sa CI était un script shell lancé chaque nuit sur les PC des chercheurs, laissés allumés pour l'occasion."
      en: "TRUST is the CEA's thermohydraulics simulation platform. Its CI was a shell script run every night on researchers' PCs, left switched on for the purpose."
    - fr: "Je l'ai revue pour qu'elle réponde mieux au besoin et s'exécute de façon plus standard : pipelines GitLab CI/CD, runners GitLab, cache d'artefacts S3 sur MinIO, supervision Prometheus et Grafana déployés en code. Les tests de non-régression des projets satellites de TRUST (Baltik) sont branchés au pipeline principal."
      en: "I reworked it to fit the need better and to run in a more standard way: GitLab CI/CD pipelines, GitLab runners, an S3 artifact cache on MinIO, Prometheus and Grafana monitoring deployed as code. The non-regression tests of TRUST's satellite projects (Baltik) are plugged into the main pipeline."
  materials:
    - { key: { fr: ci, en: ci }, value: GitLab CI }
    - { key: { fr: runners, en: runners }, value: GitLab Runner }
    - { key: { fr: cache, en: cache }, value: "MinIO (S3)" }
    - { key: { fr: supervision, en: monitoring }, value: "Prometheus, Grafana" }
  logo:
    src: /logos/trust.png
    alt: { fr: "Logo de la plateforme TRUST", en: "TRUST platform logo" }
    width: 720
    height: 110

- id: redpill
  number: 3
  kind: pro
  org: RedPill Group
  status: { fr: Stage, en: Internship }
  start: "2024-07"
  end: "2024-08"
  tag:
    fr: "Migration vers Kubernetes · OVHcloud"
    en: "Migration to Kubernetes · OVHcloud"
  line:
    fr: "Une infrastructure migrée vers un cluster Kubernetes sur OVHcloud."
    en: "An infrastructure migrated to a Kubernetes cluster on OVHcloud."
  impact:
    fr: "Une infra migrée vers Kubernetes."
    en: "An infrastructure moved to Kubernetes."
  body:
    - fr: "J'ai participé à la migration d'une infrastructure vers un cluster Kubernetes entièrement cloud, hébergé chez OVHcloud, avec des workflows de déploiement Terraform et Helm."
      en: "I took part in migrating an infrastructure to a fully cloud-hosted Kubernetes cluster at OVHcloud, with Terraform and Helm deployment workflows."
