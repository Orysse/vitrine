# nginx for the vitrine image: unprivileged, read-only root filesystem, writes only to /tmp.
# @mime@ and @root@ are filled in by the flake.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 512;
}

http {
  include @mime@;
  default_type application/octet-stream;
  charset utf-8;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain;

  server {
    listen 8080;
    root @root@;

    # HSTS, nosniff, frame deny and referrer policy come from Traefik (homelab-cluster).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://pulse.abe.lc; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://pulse.abe.lc; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # The homelab map was removed in 0.7.0; its URLs point to the explanation.
    location ~ ^/homelab/?$ { return 301 /projets/homelab/; }
    location ~ ^/en/homelab/?$ { return 301 /en/projects/homelab/; }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Fonts, PDFs and the favicon change rarely; CSS and JS are cache-busted by Zola.
    location ~* \.(woff2|pdf|svg|css|js)$ {
      expires 7d;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
  }
}
